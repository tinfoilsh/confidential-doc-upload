# Tinfoil Containers release workflow (phase 1 — initiate a release).
#
# Trigger this workflow from a branch via "Run workflow" and provide the
# version. It builds the image, updates tinfoil-config.yml, creates the release
# tag, and then dispatches phase 2 in `tinfoil-release-publish.yml` against the
# new tag to attest the image and publish the GitHub release.

name: Tinfoil Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: tinfoil-container-release-${{ inputs.version }}

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Build security-test environment
        run: docker build --target go-builder -t doc-upload-security-builder .

      - name: Test, race-check, vet, and scan reachable Go code
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            doc-upload-security-builder /bin/sh -c '
              /usr/local/go/bin/go test ./... &&
              /usr/local/go/bin/go test -race ./... &&
              /usr/local/go/bin/go vet ./... &&
              /usr/local/go/bin/go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
            '

  build:
    needs: security
    runs-on: ubuntu-latest
    permissions:
      contents: read    # checkout + check the tag does not exist
      packages: write   # push the container image
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Check if version tag already exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=sha,format=short

      - name: Build the exact release image locally
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            doc-upload-release-candidate:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}

      - name: Scan the exact release image before publication
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --image-src docker --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 \
            "doc-upload-release-candidate:$GITHUB_SHA"

      - name: Push the pre-scanned image without rebuilding
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then
              docker push "$image_tag"
            fi
          done <<EOF
          $IMAGE_TAGS
          EOF
          first_tag=$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')
          repo_digest=$(docker image inspect "$first_tag" --format '{{index .RepoDigests 0}}')
          digest=${repo_digest##*@}
          if [ -z "$digest" ]; then
            echo "::error::Failed to resolve pushed image digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # update-container-action pushes the release tag
      pull-requests: write  # required by update-container-action
      actions: write        # dispatch tinfoil-release-publish.yml on the new tag

    steps:
      - name: Update tinfoil-config.yml and create the release tag
        uses: tinfoilsh/update-container-action@5e0a3789316941664cee055706799114e0180565 # v0.6.0
        with:
          version: ${{ inputs.version }}
          source-sha: ${{ github.sha }}
          update-config: true
          image-refs: |
            ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch the publish workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run tinfoil-release-publish.yml --ref "$VERSION"
